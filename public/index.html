<!doctype html>
<html lang="en">
<head>

  <title>Gym&amp;Juice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="app">

    </header>

      <a href="#home" data-tab="home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</a>

      <a href="#feed" data-tab="feed">

    </nav>
  </div>
  <script type="module" src="/app.js"></script>
