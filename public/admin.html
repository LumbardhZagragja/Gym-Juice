<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gym&amp;Juice admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;600;700&family=Lilita+One&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    input, select { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: #fff; padding: 0 14px; font: inherit; font-size: 16px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; }
    .admin-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .admin-row .name { flex: 1; font-weight: 700; min-width: 100px; }
    .mini { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 13px; }
    .mini.danger { color: #FF8FB1; border-color: #FF8FB1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><a href="/" class="logo">Gym&amp;Juice</a></header>
    <main style="padding-bottom: 40px">
      <h1>Admin</h1>
      <form id="keyForm" class="card" style="display:flex;flex-direction:column;gap:10px">
        <label for="key">Admin key</label>
        <input id="key" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Unlock</button>
      </form>
      <div id="panel" hidden style="display:flex;flex-direction:column;gap:16px">
        <section class="card">
          <h2>The crew</h2>
          <div id="list"></div>
        </section>
        <form id="addForm" class="card" style="display:flex;flex-direction:column;gap:10px">
          <label for="newName">Add a friend</label>
          <input id="newName" maxlength="30" required placeholder="Name">
          <button class="btn" type="submit">Add</button>
        </form>
        <form id="fixForm" class="card" style="display:flex;flex-direction:column;gap:10px">
          <h2>Fix check-ins</h2>
          <p class="muted small" style="margin:0">Someone forgot to check in, or a check-in shouldn't count? Pick the person and the day.</p>
          <label for="fixPerson">Who</label>
          <select id="fixPerson" required></select>
          <label for="fixDay">Day</label>
          <input id="fixDay" type="date" required>
          <div class="row">
            <button class="btn" type="submit" data-fix="addCheckin">Add day</button>
            <button class="btn ghost" type="submit" data-fix="removeCheckin">Remove day</button>
          </div>
          <p class="small" id="fixMsg" role="status" style="margin:0;color:var(--yellow);font-weight:700"></p>
        </form>
        <p class="muted small">"Reset PIN" logs that person out; they pick a new PIN next time they open the app.</p>
      </div>
      <p class="error" id="err" role="alert"></p>
    </main>
  </div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
